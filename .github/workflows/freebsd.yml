# Keep all workflow permissions read-only for the source repository.
name: FreeBSD
on:
  push:
    branches:
      - main
      - 'freebsd-amd64-*'
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: FreeBSD ${{ matrix.release }} amd64 (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
        configuration: [default, multidomain]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@3dd136ca59fb7b16e229f4daba23c7690298df57
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: 6144
          cpu: 4
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y bash gmake gsed autoconf git ocaml-opam rsync parallel
            pw useradd oxcaml -m -s /usr/local/bin/bash
          run: |
            mkdir -p _ci_logs
            chown -R oxcaml:oxcaml "$PWD"
            status=0
            su oxcaml -c \
              'bash tools/ci/actions/freebsd.sh ${{ matrix.configuration }}' \
                || status=$?
            echo "$status" > _ci_logs/status
      - name: Preserve build and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freebsd-${{ matrix.release }}-amd64-${{ matrix.configuration }}
          path: |
            _ci_logs/
            _build/log
            _build/main/log
            _runtest/testsuite/**/_ocamltest/**/*.log
            _runtest/testsuite/**/_ocamltest/**/*.output
          if-no-files-found: warn
      - name: Check build and test result
        if: always()
        run: test "$(cat _ci_logs/status)" = 0
